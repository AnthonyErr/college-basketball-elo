name: daily-predictions
on:
  workflow_dispatch:
  schedule: # daily at 9 AM EST
    - cron: '0 14 * * *' 
permissions:
  contents: write # let the job push the new data and predictions back to the repo
concurrency: data-update # never let two data-updating runs push at the same time
jobs:
  job1:
    name: predict
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo content
        uses: actions/checkout@v4 # checkout the repository content to github runner

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.15' # install the python version needed
          
      - name: install python packages
        run: |
          python -m pip install --upgrade "pip<25"
          pip install -r requirements.txt
          
      - name: execute py script # run predictions.py
        env:
          DATAWRAPPER_API_TOKEN: ${{ secrets.DATAWRAPPER_API_TOKEN }}
          DW_PREDICTIONS_CHART_ID: ${{ secrets.DW_PREDICTIONS_CHART_ID }}
          DW_RANKINGS_CHART_ID: ${{ secrets.DW_RANKINGS_CHART_ID }}
          DW_PROBABILITIES_CHART_ID: ${{ secrets.DW_PROBABILITIES_CHART_ID }}
        run: python predictions.py -A
          
      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --cached --quiet || git commit -m "update data and make predictions"
          
      - name: push changes # back to the branch this run started from
        run: |
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
