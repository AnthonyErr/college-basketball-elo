name: weekly-rankings
on:
  workflow_dispatch:
  schedule: # weekly on Monday at 12PM ET, 17 GMT
    - cron: '0 17 * * 1' 
permissions:
  contents: write # let the job push the new data and predictions back to the repo
concurrency: data-update # never let two data-updating runs push at the same time
jobs:
  job1:
    name: rankings
    runs-on: ubuntu-24.04 # pinned: newer Ubuntu images have no Python 3.8 builds
    steps:
      - name: checkout repo content
        uses: actions/checkout@v4 # checkout the repository content to github runner

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.15' # install the python version needed
          
      - name: install python packages
        run: |
          python -m pip install --upgrade "pip<25"
          pip install -r requirements.txt
          
      - name: execute py script # run elo.py
        run: python elo.py -t 50
          
      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --cached --quiet || git commit -m "update data and publish weekly rankings"
          
      - name: push changes # back to the branch this run started from
        run: |
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
